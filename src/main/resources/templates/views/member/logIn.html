<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>
    <main>
        <h1>로그인</h1>

        <form>
            <div>
                <label for="id">아이디</label>
                <input type="text" id="id">
            </div>

            <div>
                <label for="pwd">비밀번호</label>
                <input type="password" id="pwd">
            </div>

            <p id="errorMsg"></p>

            <div>
                <button type="button" id="loginBtn">로그인</button>
            </div>
        </form>

        <div id="socialLogin">
            <button type="button" id="kakaoLoginBtn">카카오 로그인</button>
        </div>

        <div id="loginLinks">
            <a id="enrollLink" href="/member/enroll">회원가입</a>
            <a id="findIdPwLink" href="/member/findIDPW">아이디 / 비밀번호 찾기</a>
        </div>
    </main>
    
    <script>
    	window.addEventListener("load",()=>{
			document.getElementById("loginBtn").addEventListener("click",()=>{
				const id = document.getElementById("id").value;
				const pwd = document.getElementById("pwd");
				
				fetch('/rest/member/logIn',{
					method:'post',
					headers:{'content-type':'application/x-www-form-urlencoded'},
					body: new URLSearchParams({
						memberId:id.trim(),
						memberPwd:pwd.value.trim()
					})
				})
				.then(res => res.text())
				.then(data => {
					const errorMsg = document.getElementById('errorMsg');

					if (data.trim() === 'success') {
					    location.href = '/';
					} else {
					    pwd.value = '';           // 비밀번호 입력창 비우기
					    pwd.focus();              // 바로 다시 입력할 수 있게 커서 이동
					    errorMsg.style.color = 'red';  // 빨간색 지정
					    errorMsg.textContent = '아이디 또는 비밀번호가 일치하지 않습니다.';
					}
				})
				.catch(err => console.log(err))
			});
    	});
    </script>
</body>
</html>
