<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>
    <main>
        <h1>로그인</h1>

        <form id="loginForm">
            <div>
                <label for="memberId">아이디</label>
                <input type="text" id="memberId">
            </div>

            <div>
                <label for="memberPwd">비밀번호</label>
                <input type="password" id="memberPwd">
            </div>

            <p id="errorMsg"></p>

            <div>
                <button id="loginBtn">로그인</button>
            </div>
        </form>

        <div id="socialLogin">
            <button id="kakaoLoginBtn">카카오 로그인</button>
        </div>

        <div id="loginLinks">
            <a id="enrollLink">회원가입</a>
            <a id="findIdPwLink">아이디 / 비밀번호 찾기</a>
        </div>
    </main>
</body>
</html>
